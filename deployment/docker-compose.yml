services:
  docmost:
    build:
      context: ..
      dockerfile: Dockerfile
    image: docmost-local:latest
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${DOCMOST_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - docmost_storage:/app/data/storage

  db:
    image: postgres:18
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  sync:
    build:
      context: ./sync
    depends_on:
      - db
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - backup_data:/backup
      - docmost_storage:/data/docmost-storage:ro
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro

volumes:
  docmost_storage:
  db_data:
  redis_data:
  backup_data:
